services:
  ollama:
    image: ollama/ollama:latest
    container_name: python-learning-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: python-learning-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  valkey:
    image: valkey/valkey:latest
    container_name: python-learning-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
  valkey_data: